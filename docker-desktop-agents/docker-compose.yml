x-agent-common: &agent-common
  shm_size: "1gb"
  restart: unless-stopped
  # Identical resource caps on every agent container — the one knob most
  # likely to quietly tilt a "fair" comparison between local models if left
  # to vary. Raise/lower together, never per-agent, unless that's the thing
  # you're deliberately testing.
  cpus: "${AGENT_CPUS:-2.0}"
  mem_limit: "${AGENT_MEM_LIMIT:-4g}"

x-common-env: &common-env
  RESOLUTION: "1280x800x24"
  DISPLAY_WIDTH: "1280"
  DISPLAY_HEIGHT: "800"
  VNC_PASSWORD: "${VNC_PASSWORD:-playground}"
  # Decoding + budget knobs kept identical across agents by default so any
  # difference in outcome traces back to the model, not the harness.
  OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-0.2}"
  OLLAMA_SEED: "${OLLAMA_SEED:-42}"
  OLLAMA_NUM_PREDICT: "${OLLAMA_NUM_PREDICT:-256}"
  MAX_TURNS: "${MAX_TURNS:-200}"
  TURN_DELAY_SECONDS: "${TURN_DELAY_SECONDS:-1.0}"
  WALL_CLOCK_LIMIT_SECONDS: "${WALL_CLOCK_LIMIT_SECONDS:-1800}"

services:
  computer1-agent1:
    <<: *agent-common
    container_name: computer1-agent1
    build:
      context: ./agent
      args:
        OLLAMA_MODEL: "${COMPUTER1_AGENT1_MODEL:-moondream}"
    environment:
      <<: *common-env
      AGENT_NAME: "computer1-agent1"
      OLLAMA_MODEL: "${COMPUTER1_AGENT1_MODEL:-moondream}"
      TASK: "${COMPUTER1_AGENT1_TASK:-${SHARED_TASK:-Open the text editor, type DONE, then stop.}}"
    networks: [computer1-net]
    ports:
      - "6901:80"   # noVNC web viewer -> http://localhost:6901/?password=$VNC_PASSWORD
      - "7901:7000" # live view: latest screenshot + model reasoning, no VNC needed

  computer1-agent2:
    <<: *agent-common
    container_name: computer1-agent2
    build:
      context: ./agent
      args:
        OLLAMA_MODEL: "${COMPUTER1_AGENT2_MODEL:-moondream}"
    environment:
      <<: *common-env
      AGENT_NAME: "computer1-agent2"
      OLLAMA_MODEL: "${COMPUTER1_AGENT2_MODEL:-moondream}"
      TASK: "${COMPUTER1_AGENT2_TASK:-${SHARED_TASK:-Open the text editor, type DONE, then stop.}}"
    networks: [computer1-net]
    ports:
      - "6902:80"
      - "7902:7000"

  computer2-agent1:
    <<: *agent-common
    container_name: computer2-agent1
    build:
      context: ./agent
      args:
        OLLAMA_MODEL: "${COMPUTER2_AGENT1_MODEL:-moondream}"
    environment:
      <<: *common-env
      AGENT_NAME: "computer2-agent1"
      OLLAMA_MODEL: "${COMPUTER2_AGENT1_MODEL:-moondream}"
      TASK: "${COMPUTER2_AGENT1_TASK:-${SHARED_TASK:-Open the text editor, type DONE, then stop.}}"
    networks: [computer2-net]
    ports:
      - "6903:80"
      - "7903:7000"

  computer2-agent2:
    <<: *agent-common
    container_name: computer2-agent2
    build:
      context: ./agent
      args:
        OLLAMA_MODEL: "${COMPUTER2_AGENT2_MODEL:-moondream}"
    environment:
      <<: *common-env
      AGENT_NAME: "computer2-agent2"
      OLLAMA_MODEL: "${COMPUTER2_AGENT2_MODEL:-moondream}"
      TASK: "${COMPUTER2_AGENT2_TASK:-${SHARED_TASK:-Open the text editor, type DONE, then stop.}}"
    networks: [computer2-net]
    ports:
      - "6904:80"
      - "7904:7000"

  viewer:
    image: nginx:alpine
    container_name: desktop-agents-viewer
    volumes:
      - ./viewer/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8080:80"
    networks: [computer1-net, computer2-net]

  # Live, searchable logs for every container in the stack in one browser
  # tab — stdout/stderr only (supervisord's own per-process logs, e.g.
  # agent.py's reasoning, still need `docker exec ... cat /var/log/agent.log`
  # or the per-agent live-view page on 7901-7904).
  logs:
    image: amir20/dozzle:latest
    container_name: desktop-agents-logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "9999:8080"

networks:
  # Each "computer" is its own network; the two agents on it can see each
  # other but not the agents on the other "computer". This is plain bridge
  # isolation, not `internal: true` — on this Docker Desktop setup,
  # `internal: true` was found to also suppress inbound port publishing
  # (noVNC never bound), not just outbound egress, which broke viewing.
  # Isolation from the internet isn't load-bearing here regardless: every
  # agent's model is baked into its image at build time and agent.py makes
  # no runtime network call except to 127.0.0.1 (its own Ollama). Nothing in
  # the stack initiates outbound traffic once it's up.
  computer1-net: {}
  computer2-net: {}
