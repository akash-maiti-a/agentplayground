# stdout_logfile=/dev/stdout (not a file under /var/log) so these three
# programs' output lands in the container's own stdout, which is what
# `docker logs` / Dozzle read. agent.py still also writes status.json +
# latest.png under /opt/agent/public for the live-view page.

[program:ollama-serve]
command=ollama serve
autostart=true
autorestart=true
startretries=10
startsecs=3
priority=500
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/ubuntu",USER="root",OLLAMA_HOST="127.0.0.1:11434"

[program:live-view]
command=python3 -m http.server 7000 --directory /opt/agent/public
autostart=true
autorestart=true
startretries=10
startsecs=3
priority=600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/ubuntu",USER="root"

[program:computer-use-agent]
command=python3 /opt/agent/agent.py
autostart=true
autorestart=true
startretries=10
startsecs=5
priority=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/ubuntu",USER="root"
