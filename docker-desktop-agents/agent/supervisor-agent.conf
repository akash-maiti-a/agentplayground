[program:ollama-serve]
command=ollama serve
autostart=true
autorestart=true
startretries=10
startsecs=3
priority=500
stdout_logfile=/var/log/ollama.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
environment=HOME="/root",USER="root",OLLAMA_HOST="127.0.0.1:11434"

[program:computer-use-agent]
command=python3 /opt/agent/agent.py
autostart=true
autorestart=true
startretries=10
startsecs=5
priority=999
stdout_logfile=/var/log/agent.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
environment=HOME="/root",USER="root"
