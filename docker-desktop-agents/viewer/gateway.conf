# Lab gateway: the ONLY container that bridges the agents' internal networks
# and the host. Agents sit on `internal: true` networks (no route out, so a
# model-chosen shell command can't reach the internet), and every desktop /
# live view is published through this proxy instead, on 127.0.0.1 only.
#
# Upstreams are resolved per request through Docker's embedded DNS, so nginx
# still starts when computer2's agents (the "full" profile) aren't running;
# their ports just return 502 until they are.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared proxy settings (noVNC needs the WebSocket upgrade headers).
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_read_timeout 1h;
proxy_buffering off;

# Link hub.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
}

# noVNC desktops (agent container port 80).
server { listen 6901; location / { set $up computer1-agent1; proxy_pass http://$up:80; } }
server { listen 6902; location / { set $up computer1-agent2; proxy_pass http://$up:80; } }
server { listen 6903; location / { set $up computer2-agent1; proxy_pass http://$up:80; } }
server { listen 6904; location / { set $up computer2-agent2; proxy_pass http://$up:80; } }

# Live views (agent container port 7000).
server { listen 7901; location / { set $up computer1-agent1; proxy_pass http://$up:7000; } }
server { listen 7902; location / { set $up computer1-agent2; proxy_pass http://$up:7000; } }
server { listen 7903; location / { set $up computer2-agent1; proxy_pass http://$up:7000; } }
server { listen 7904; location / { set $up computer2-agent2; proxy_pass http://$up:7000; } }
